<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Irodori TTS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark">彩</span>
      <div>
        <h1>Irodori TTS</h1>
        <p>Qwen3-TTS 0.6B · CustomVoice</p>
      </div>
    </div>
    <div class="status" id="statusPill" data-state="loading">
      <span class="dot"></span>
      <span id="statusText">Đang tải model…</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel voices">
      <div class="section-head">
        <h2>Chọn nhân vật</h2>
        <p>9 giọng premium — mỗi giọng có ngôn ngữ bản địa riêng</p>
      </div>
      <div class="voice-grid" id="voiceGrid"></div>
    </section>

    <section class="panel compose">
      <div class="section-head">
        <h2>Soạn lời thoại</h2>
        <p>Chọn ngôn ngữ, viết text, nghe thử ngay</p>
      </div>

      <label class="field">
        <span>Ngôn ngữ</span>
        <select id="language"></select>
      </label>

      <label class="field">
        <span>Văn bản</span>
        <textarea id="text" rows="6" placeholder="Nhập câu bạn muốn nhân vật đọc…" maxlength="4000"></textarea>
        <div class="meta-row">
          <span id="charCount">0 / 4000</span>
          <button type="button" class="linkish" id="sampleBtn">Dùng mẫu</button>
        </div>
      </label>

      <label class="field">
        <span>Phong cách <em>(tuỳ chọn)</em></span>
        <input id="instruct" type="text" placeholder="VD: nói vui vẻ / speak gently / 用温柔的语气说" />
      </label>

      <div class="actions">
        <button type="button" class="primary" id="speakBtn">
          <span class="btn-label">Tạo giọng nói</span>
          <span class="spinner" hidden></span>
        </button>
      </div>

      <div class="player" id="player" hidden>
        <audio id="audio" controls></audio>
        <a id="download" class="linkish" download="irodori.wav">Tải file WAV</a>
      </div>

      <p class="error" id="error" hidden></p>
    </section>
  </main>

  <footer>
    <span>Model: <code id="modelName">—</code></span>
    <span>Device: <code id="deviceName">—</code></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
